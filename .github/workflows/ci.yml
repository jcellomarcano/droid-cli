name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: DROID_PY=python tools/verify/verify.sh

  install-script:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: PYTHON="$(which python)" ./install.sh
      - run: |
          export PATH="$HOME/.local/bin:$PATH"
          droid --help
          droid config
          set +e
          out="$(droid ls 2>&1)"; rc=$?
          set -e
          echo "$out"
          if [ $rc -ne 0 ] && ! echo "$out" | grep -qi "adb"; then
            echo "droid ls failed for a reason other than a missing adb" >&2; exit 1
          fi
      - run: .venv/bin/python -m pip install -e ".[test]" && tools/verify/verify.sh
      - run: |
          if [ "$(.venv/bin/python -c 'import sys; print(sys.version_info.minor)')" != "11" ]; then
            echo "install.sh ignored PYTHON" >&2; exit 1
          fi

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build && python -m build
      - run: |
          tar tzf dist/*.tar.gz > sdist.txt
          if grep -E "fixtures/raw|\.droid/" sdist.txt; then echo "raw material in sdist" >&2; exit 1; fi
          unzip -l dist/*.whl | grep -E "droid/" | head -3
